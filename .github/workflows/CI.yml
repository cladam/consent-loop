name: Build, test and publish

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Koka compiler
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/download/v3.2.3/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install hica compiler
        run: |
          curl -fsSL https://www.hica.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify compiler versions
        run: |
          koka --version
          hica --version

      - name: Install C library dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libmicrohttpd-dev libsqlite3-dev sqlite3

      - name: Install Choreo
        run: cargo install --locked choreo --version 0.15.0

      - name: Check formatting and analysis
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            hica fmt --check "$file"
            hica analyse "$file"
          done < <(find src tests examples -name '*.hc' -type f | sort)

      - name: Run unit tests
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          failed=0
          tests=(tests/*_test.hc)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "error: no test files matched tests/*_test.hc"
            exit 1
          fi
          for f in "${tests[@]}"; do
            echo "=== $f ==="
            if ! hica test "$f"; then
              failed=1
            fi
          done
          exit $failed

      - name: Run executable acceptance specifications
        run: make test-acceptance

  docker:
    name: Build Docker image and smoke test
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image locally (for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: consent-loop:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          cleanup() {
            docker rm -f consent-loop-smoke > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name consent-loop-smoke \
            -p 8080:8080 \
            consent-loop:smoke
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:8080/health > /dev/null; then
            echo "Server did not start — container logs:"
            docker logs consent-loop-smoke
            exit 1
          fi
          # The smoke test only verifies the container starts and
          # the health endpoint returns HTTP 200.
          echo "Smoke test passed: /health returned HTTP 200"

      - name: Push image to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    name: Build and publish release binary
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Koka compiler
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/download/v3.2.3/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install hica compiler
        run: |
          curl -fsSL https://www.hica.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install C library dependencies (libcurl, libmicrohttpd, libsqlite3)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libmicrohttpd-dev libsqlite3-dev

      - name: Build release binary (linux/x86_64)
        run: |
          sed -i \
            -e 's| --ccincdir=/opt/homebrew/include||g' \
            -e 's| --cclinkopts=-L/opt/homebrew/lib||g' \
            hica.hml
          hica fetch && hica build -o consent-loop-linux-x86_64

      - name: Create GitHub release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: consent-loop-linux-x86_64
