services:
  consent-loop:
    platform: linux/amd64
    build: .
    image: ghcr.io/cladam/consent-loop:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CONSENT_LOOP_DB_PATH: /app/data/consent-loop.db
    volumes:
      - ${CONSENT_LOOP_DATA_DIR}:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
